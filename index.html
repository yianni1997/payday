<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFE600">
<title>Payday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<script src="pdf.min.js"></script>
<script src="jszip.min.js"></script>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#F2F3EF; --surface:#FFFFFF; --sunk:#E8EAE4; --ink:#151716; --muted:#5D635F; --line:#DCDFD8;
  --personal:#FFE600; --on-personal:#161616; --savings:#13B847; --gas:#FF8A00; --debt:#E5484D; --income:#2F7CF6;
  --neg:#C2272D; --pos:#0E8F37; --focus:#2F7CF6;
  --display:"Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111312; --surface:#1A1D1B; --sunk:#232724; --ink:#ECEEEA; --muted:#9BA29D; --line:#2C312E;
    --savings:#2BD263; --gas:#FF9A26; --debt:#FF6166; --income:#5C9BFF; --neg:#FF7A7F; --pos:#45D97A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111312; --surface:#1A1D1B; --sunk:#232724; --ink:#ECEEEA; --muted:#9BA29D; --line:#2C312E;
  --savings:#2BD263; --gas:#FF9A26; --debt:#FF6166; --income:#5C9BFF; --neg:#FF7A7F; --pos:#45D97A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em}
h1{font-size:28px;font-weight:800}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:14px}

/* layout */
.shell{display:block}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{flex:1;background:none;border:0;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:700}
nav.tabs button[aria-current="page"] .ico{background:var(--personal);color:var(--on-personal)}
nav.tabs .ico{display:grid;place-items:center;width:52px;height:30px;border-radius:15px}
.badge{position:absolute;top:4px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--debt);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.brand{display:none}
main{max-width:760px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){
  nav.tabs{top:0;right:auto;bottom:0;width:220px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:calc(20px + env(safe-area-inset-top,0px)) 12px 20px;gap:4px}
  nav.tabs button{flex:0;flex-direction:row;gap:12px;padding:6px 8px;font-size:16px;border-radius:12px;justify-content:flex-start}
  nav.tabs button:hover{background:var(--sunk)}
  nav.tabs .ico{width:44px;height:32px}
  .badge{position:static;margin-left:auto}
  .brand{display:block;font-family:var(--display);font-weight:800;font-size:24px;padding:4px 12px 20px}
  main{margin-left:220px;max-width:none;padding:28px 40px 60px}
  .home-grid{display:grid;grid-template-columns:minmax(320px,420px) 1fr;gap:32px;align-items:start}
  .home-grid > .col-left{position:sticky;top:28px}
}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.period-nav{display:flex;align-items:center;gap:4px}
.iconbtn{width:40px;height:40px;border-radius:20px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn:disabled{opacity:.35;cursor:default}
.iconbtn svg{width:20px;height:20px}
.period-label{font-family:var(--display);font-weight:700;font-size:17px;min-width:150px;text-align:center}
@media (max-width:560px){.topbar.home{flex-wrap:wrap}.topbar.home .period-nav{width:100%;justify-content:space-between}}
.period-label small{display:block;font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted)}

/* hero */
.hero{background:var(--personal);color:var(--on-personal);border-radius:20px;padding:18px 20px 20px;position:relative}
.hero .lbl{font-weight:700;font-size:15px;display:flex;justify-content:space-between;gap:8px}
.hero .big{font-family:var(--display);font-weight:800;font-size:clamp(48px,14vw,68px);line-height:1;margin:8px 0 12px;letter-spacing:-.03em}
.hero .big.over{color:#B3141A}
.hero .meter{height:10px;border-radius:5px;background:rgba(0,0,0,.14);overflow:hidden}
.hero .meter i{display:block;height:100%;background:#161616;border-radius:5px}
.hero .foot{display:flex;justify-content:space-between;margin-top:10px;font-size:14px}

.split{margin:18px 0 6px}
.split .bar{display:flex;gap:3px;height:14px}
.split .bar span{border-radius:4px;min-width:3px}
.split .legend{display:flex;justify-content:space-between;margin-top:6px;font-size:13px;color:var(--muted)}

.funds{margin-top:14px;background:var(--surface);border-radius:16px;border:1px solid var(--line);overflow:hidden}
.fund{display:grid;grid-template-columns:6px 1fr auto;gap:0 12px;align-items:center;padding:12px 14px 12px 0;border-top:1px solid var(--line)}
.fund:first-child{border-top:0}
.fund .strip{align-self:stretch;border-radius:0 3px 3px 0}
.fund .name{font-weight:700}
.fund .sub{font-size:13px;color:var(--muted)}
.fund .amt{text-align:right;font-family:var(--display);font-weight:700;font-size:18px}
.fund .amt small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted)}
.fund.clickable:hover{background:var(--sunk)}
.goals{margin-top:14px;background:var(--surface);border-radius:16px;border:1px solid var(--line);padding:14px}
.goal{padding:10px 0;border-top:1px solid var(--line)}
.goal:first-of-type{border-top:0}
.goal .bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;margin:6px 0 4px}
.goal .bar i{display:block;height:100%;background:var(--savings);border-radius:4px}
.ver{display:block;margin:28px auto 0;background:none;border:0;color:var(--muted);font-size:12px;cursor:pointer;padding:6px 10px}
.ver:hover{color:var(--ink)}
nav.tabs .navver{display:none}
@media (min-width:900px){nav.tabs .navver{display:block;flex:0;margin-top:auto;padding:8px 12px;font-size:12px;color:var(--muted);background:none;border:0;text-align:left;cursor:pointer}}
.fund .mini{grid-column:2/4;height:4px;border-radius:2px;background:var(--sunk);margin-top:8px;overflow:hidden}
.fund .mini i{display:block;height:100%}
.fund.clickable{cursor:pointer}

.banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);margin-bottom:12px;width:100%;text-align:left}
.banner b{display:block}
.banner .go{margin-left:auto;font-weight:700;white-space:nowrap}
.banner .dot{width:10px;height:10px;border-radius:5px;flex:none}

/* transactions */
.section-h{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 8px}
.day{margin-top:14px}
.day > .dh{font-size:13px;color:var(--muted);font-weight:700;padding:0 2px 6px;display:flex;justify-content:space-between}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tx{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.tx:first-child{border-top:0}
.tx .ck{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:800;line-height:1;color:transparent}
.tx.sel{background:var(--sunk)}
.tx.sel .ck{background:var(--neg);border-color:var(--neg);color:#fff}
.selbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
.selbar .grow{flex:1;min-width:0}
.tx:hover{background:var(--sunk)}
.av{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px;flex:none;color:#161616}
.tx .mid{flex:1;min-width:0}
.tx .d{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .c{font-size:13px;color:var(--muted)}
.tx .a{font-family:var(--display);font-weight:700;font-size:17px;white-space:nowrap}
.tx .a.inc{color:var(--pos)}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:4px}

/* buttons */
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--ink);color:var(--bg);min-height:46px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.yellow{background:var(--personal);color:var(--on-personal)}
.btn.danger{background:transparent;color:var(--neg);border:1.5px solid var(--line)}
.btn.sm{padding:8px 12px;min-height:38px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:30px;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;z-index:15;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.fab[hidden]{display:none}
.fab svg{width:28px;height:28px}
@media (min-width:900px){.fab{bottom:32px;right:32px}}

/* segmented */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;display:flex;align-items:center;gap:6px}
.seg button .sw{width:10px;height:10px;border-radius:5px}
.seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg);font-weight:700}

/* review */
.rv{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.rv .top{display:flex;gap:10px;align-items:flex-start}
.rv .top .mid{flex:1;min-width:0}
.rv .desc{font-weight:700;word-break:break-word}
.rv .meta{font-size:13px;color:var(--muted)}
.rv .amt{font-family:var(--display);font-weight:800;font-size:20px;white-space:nowrap}
.rv .amt.in{color:var(--pos)}
.rv .seg{margin:12px 0}
.rv .acts{display:flex;gap:8px;justify-content:flex-end}
.linkish{background:none;border:0;padding:0;text-align:left;font:inherit;font-weight:700;color:inherit;cursor:pointer}
.linkish .pen{color:var(--muted);font-weight:400;font-size:14px;margin-left:4px}
.rv .details{font-size:14px;margin-top:2px}
textarea.input{min-height:120px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;resize:vertical}
.status{display:flex;align-items:center;gap:8px;font-weight:700}
.status i{width:10px;height:10px;border-radius:5px;background:var(--savings);display:inline-block}
.status.off i{background:var(--line)}
.selbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);padding:10px 0 12px;margin:0 0 12px;border-bottom:1px solid var(--line)}
.selbar .row{gap:8px}
.rv.picked{border-color:var(--ink);box-shadow:0 0 0 1.5px var(--ink) inset}
.rck{width:24px;height:24px;flex:none;margin:2px 4px 0 0;accent-color:var(--ink);cursor:pointer}
.desk-only{display:none}
@media (min-width:900px){.desk-only{display:inline-flex}}
.rv.cmp{padding:6px 10px;margin-bottom:4px;border-radius:10px}
.crow{display:flex;align-items:center;gap:10px}
.crow .cdate{width:52px;flex:none}
.crow .cdesc{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .chip{flex:none}
.crow .csel{width:auto;min-height:34px;padding:4px 8px;font-size:14px;flex:none}
.crow .camt{width:96px;text-align:right;font-family:var(--display);font-weight:700;flex:none}
.crow .camt.in{color:var(--pos)}
.crow .btn.sm{min-height:34px;padding:4px 12px;flex:none}
.rv.grp:not(.cmp){border-style:dashed}
.rv.kfocus{outline:3px solid var(--focus);outline-offset:2px}
.kbd-hint{display:none}
@media (min-width:900px){.kbd-hint{display:block}}
.rv .note{font-size:13px;background:var(--sunk);border-radius:8px;padding:6px 10px;margin-top:10px}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--ink)}
.bulk{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0 16px}
details.dups{margin-top:18px}
details.dups summary{cursor:pointer;font-weight:700;padding:10px 0}

/* import */
.drop{display:block;border:2px dashed var(--line);border-radius:20px;padding:28px 18px;text-align:center;background:var(--surface);cursor:pointer;margin:14px 0}
.drop.over{border-color:var(--ink);background:var(--sunk)}
.drop b{font-family:var(--display);font-size:20px;display:block;margin-bottom:4px}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.imp{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.imp table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
.imp td{padding:5px 4px;border-top:1px solid var(--line)}
.imp td:last-child{text-align:right;white-space:nowrap}
.tablewrap{overflow-x:auto}
.help{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 16px;margin-top:18px}
.help details{border-top:1px solid var(--line);padding:10px 0}
.help details:first-child{border-top:0}
.help summary{cursor:pointer;font-weight:700}
.help p{margin:8px 0 0;color:var(--muted);font-size:15px}
.spinner{display:inline-block;width:16px;height:16px;border:2.5px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px}
@keyframes spin{to{transform:rotate(360deg)}}

/* trends */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .v{font-family:var(--display);font-weight:800;font-size:clamp(17px,4.6vw,24px)}
.stat .k{font-size:13px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.cat{display:grid;grid-template-columns:110px 1fr 76px;gap:10px;align-items:center;padding:5px 0;font-size:15px}
.cat .b{height:12px;border-radius:6px;background:var(--sunk);overflow:hidden}
.cat .b i{display:block;height:100%;background:var(--personal);border-radius:6px}
.cat > .num{text-align:right}
svg.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}

/* settings */
.field{display:block;margin-bottom:14px}
.field span{display:block;font-weight:700;margin-bottom:6px;font-size:15px}
.field small{display:block;color:var(--muted);font-weight:400;margin-top:4px}
.input{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;min-height:46px}
.input:focus{border-color:var(--ink);outline:none}
.input.bigamt{font-family:var(--display);font-weight:800;font-size:34px;text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;animation:up .2s ease-out}
.sheet-x{position:sticky;top:0;float:right;z-index:3;width:40px;height:40px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;margin:0 -6px 6px 10px}
.sheet-x svg{width:20px;height:20px}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h2{margin-bottom:14px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:22px;padding-bottom:22px}.sheet .grab{display:none}}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.spinner{animation-duration:3s}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;z-index:50;max-width:min(92vw,460px);font-weight:700;font-size:15px}
@media (min-width:900px){.toast{bottom:32px;margin-left:110px}}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted)}
.notice{font-size:14px;background:var(--sunk);border-radius:12px;padding:10px 12px;margin-top:10px}
</style>
</head>
<body>
<div class="shell">
  <nav class="tabs" id="tabs" aria-label="Main"></nav>
  <main id="main"><div class="loading"><div><span class="spinner"></span> Loading</div></div></main>
</div>
<button class="fab" id="fab" aria-label="Add a transaction" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="sheetRoot"></div>
<div id="toastRoot" aria-live="polite"></div>

<script src="firebase-app-compat.js"></script>
<script src="firebase-auth-compat.js"></script>
<script src="firebase-firestore-compat.js"></script>
<script>
"use strict";
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2 = n => Math.round((+n || 0) * 100) / 100;
const money = (n, opts={}) => {
  const v = r2(n), a = Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
  if (opts.sign && v > 0) return "+$" + a;
  return (v < 0 ? "−$" : "$") + a;
};
const money0 = n => (n < 0 ? "−$" : "$") + Math.round(Math.abs(n)).toLocaleString("en-US");
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
const toD = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = toD(s); d.setDate(d.getDate()+n); return iso(d); };
const todayIso = () => iso(new Date());
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const short = s => { const d = toD(s); return MON[d.getMonth()] + " " + d.getDate(); };
const longDay = s => { const d = toD(s); return d.toLocaleDateString("en-US",{weekday:"long", month:"short", day:"numeric"}); };
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const clone = o => JSON.parse(JSON.stringify(o));
function hash(s){ let h = 0x811c9dc5; for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); } return (h>>>0).toString(36); }

const FUNDS = {
  personal:{label:"Personal", color:"var(--personal)"},
  gas:{label:"Gas", color:"var(--gas)"},

// Reads the text you get by selecting everything on Amazon's Your Orders page and copying it.
function amzParseText(text){
  const lines = text.replace(/\r/g, "").split("\n").map(l => l.replace(/\s+/g, " ").trim()).filter(Boolean);
  const STOP = /^(ask alexa|view return|view refund|return\/refund status|your item has been|rate (and review|your)|add to cart|see item details|item details|order again|hide order|unhide order|manage|share|visit the|1-click|get it by|delivery by|buy it again|view your item|view item|track package|return or replace items?|return items?|replace items?|write a (product )?review|leave seller feedback|view order details|order details|view invoice|invoice|archive order|get product support|get help with order|ask product question|share gift receipt|problem with order|cancel items?|view related transactions|see all|show more|sold by|return window|eligible for return|returned|refund|your package|package (was|is)|delivered|arriving|now arriving|expected|shipped|not yet shipped|it'?s on the way|out for delivery|auto-?delivered|subscribe|subscription|quantity|qty|condition|gift|ship to|order placed|total|order #|recipient|buy again|your orders|orders|search all orders|digital orders|cancelled orders|local store orders|amazon pay|not yet dispatched|dispatched|paid|price|deliver|leave a review|product support|you purchased|purchased|this item|change|apply|filter|past \d+|\d{4}$)/i;
  const out = []; let cur = null, afterShipTo = false;
  const finish = () => { if (cur && cur.order && cur.date && cur.total > 0){ out.push({key: cur.order + "|" + cur.date, order: cur.order, date: cur.date, ship: cur.date, total: cur.total, items: cur.items, pasted: true}); } };
  for (let i = 0; i < lines.length; i++){
    const l = lines[i];
    let m;
    if ((m = l.match(/^order placed:?\s*(.*)$/i))){ finish(); cur = {items: []}; const d = m[1] || lines[i+1] || ""; cur.date = parseDate(d.replace(/^on /i, "")); if (!m[1]) i++; continue; }
    if (!cur) continue;
    if ((m = l.match(/^total:?\s*(.*)$/i)) && cur.total === undefined){ const v = m[1] || lines[i+1] || ""; const a = parseAmt(v); if (!isNaN(a)){ cur.total = Math.abs(a); if (!m[1]) i++; } continue; }
    if ((m = l.match(/order\s*#\s*:?\s*([0-9D][0-9A-Z]{2}-\d{7}-\d{7})/i))){ cur.order = m[1]; continue; }

    if (afterShipTo){ afterShipTo = false; if (l.length < 40) continue; }
    if (!cur.order) continue;
    if (STOP.test(l) || /^\$?[\d,.]+$/.test(l) || /^(sold|supplied|shipped|fulfilled) by/i.test(l) || l.length < 12 || !/[a-z]{3}/i.test(l)) continue;

    if (!cur.items.includes(l) && cur.items.length < 12) cur.items.push(l);
  }

  return out;
}

const AMZ_JUNK = /^(ask alexa[^,]*|view return[^,]*|view refund[^,]*|rate your[^,]*|add to cart|see item details)$/i;
function amzScrub(){

async function amzImport(file){
  try{
    let texts = [];
    if (/\.zip$/i.test(file.name)){
      if (!window.JSZip) throw new Error("The zip reader didn’t load. Unzip the file and pick the CSV inside instead.");
      const zip = await JSZip.loadAsync(await file.arrayBuffer());
      const csvs = Object.values(zip.files).filter(f => !f.dir && /\.csv$/i.test(f.name));
      for (const f of csvs) texts.push(await f.async("string"));
    } else texts.push(await file.text());
    let ships = [];
    for (const t of texts){ const got = amzParse(parseCSV(t)); if (got) ships = ships.concat(got); }
    if (!ships.length) throw new Error("No orders found. Pick the Amazon order history file (Retail.OrderHistory or Your Orders).");
    const n = await amzMerge(ships);
    render(); toast(`${ships.length} Amazon shipment${ships.length===1?"":"s"} imported. ${n} charge${n===1?"":"s"} linked automatically.`);

}

const AMAZON_RE = /amazon|amzn|kindle|audible|prime video|amazon prime/i;
function searchRows(){

function fixOverdraftLines(){

    const pIn = periodFor(it.date), gk = gkey(it), grp = groups[gk];
    const hdr = multi && (ix === 0 || periodFor(items[ix-1].date) !== pIn) ? `<h3 style="margin:${ix?22:4}px 0 8px">${pIn === latestP ? "This paycheck" : "Past paycheck"}: ${esc(short(pIn))} to ${esc(short(minIso(periodEnd(pIn), todayIso())))} <span class="muted small">(${items.filter(x => periodFor(x.date) === pIn).length})</span>${S.rsel ? ` <button class="btn ghost sm" style="min-height:30px;padding:3px 10px;margin-left:6px" data-act="rsel-period" data-p="${esc(pIn)}">Select these</button>` : ""}</h3>` : "";
    const where = it.fund === "paycheck" ? `Starts a new paycheck on ${short(it.date)}` : it.fund === "skip" ? "Won’t be counted" : pIn ? `Goes in the ${short(pIn)} paycheck${S.periods[pIn] && S.periods[pIn].closed ? " (closed)" : ""}` : "";
    const picked = S.rsel && S.rsel.has(it.id);
    if (grp.length > 1 && !(S.rexp && S.rexp.has(gk))){ if (emitted.has(gk)) return ""; emitted.add(gk); return hdr + groupCard(grp, gk, compact); }
    const ghead = grp.length > 1 && grp[0] === it ? `<div class="row" style="justify-content:space-between;margin:6px 0"><b class="small">${esc(it.desc)} ×${grp.length}, ${esc(short(it.date))}</b><button class="btn ghost sm" data-act="gexp" data-k="${esc(gk)}">Group them again</button></div>` : "";
    if (compact) return hdr + ghead + compactRow(it, picked);
    return hdr + ghead + `<article class="rv ${picked ? "picked" : ""}" data-rid="${esc(it.id)}">
      <div class="top">${S.rsel ? `<input type="checkbox" class="rck" data-rsel="${esc(it.id)}" ${picked ? "checked" : ""} aria-label="Select ${esc(it.desc)}">` : ""}<div class="mid"><button class="desc linkish" data-act="edit-item" data-id="${esc(it.id)}" aria-label="Rename or add details">${esc(it.desc)}<span class="pen" aria-hidden="true">✎</span></button>${it.details?`<div class="details">${esc(it.details)}</div>`:""}<div class="meta">${esc(short(it.date))} • <span class="chip">${esc(SOURCES[it.src]||it.src)}</span></div></div>
      <div class="amt num ${it.flow>0?"in":""}">${it.flow>0?"+"+money(it.flow):money(-it.flow)}</div></div>
      ${fundSeg(it)}
      <div class="row" style="justify-content:space-between"><span class="small muted">${esc(where)}</span>
      <div class="acts"><button class="btn danger sm" data-act="deny" data-id="${esc(it.id)}">Deny</button><button class="btn ghost sm" data-act="edit-item" data-id="${esc(it.id)}">Edit</button><button class="btn sm" data-act="confirm" data-id="${esc(it.id)}">Confirm</button></div></div>
      ${it.note?`<div class="note">${esc(it.note)}</div>`:""}
    </article>`;
  }).join("");
  const dupHtml = dups.length ? `<details class="dups"><summary>${dups.length} hidden as duplicates</summary><p class="small" style="margin:0 0 8px"><button class="btn ghost sm" data-act="open-merges">Check all merges</button></p>${dups.map(it => `<article class="rv"><div class="top"><div class="mid"><div class="desc">${esc(it.desc)}</div><div class="meta">${esc(short(it.date))} • <span class="chip">${esc(SOURCES[it.src]||it.src)}</span></div></div><div class="amt num">${money(Math.abs(it.flow))}</div></div><div class="note">${esc(it.dupNote||"Matches another charge")}</div><div class="acts" style="margin-top:10px"><button class="btn ghost sm" data-act="dismiss-dup" data-id="${esc(it.id)}">It’s a duplicate</button><button class="btn sm" data-act="undup" data-id="${esc(it.id)}">Not a duplicate</button></div></article>`).join("")}</details>` : "";
  if (S.rsel) for (const id of [...S.rsel]) if (!items.some(i => i.id === id)) S.rsel.delete(id);
  const n = S.rsel ? S.rsel.size : 0;
  const setOpts = [["","Set selected to…"],["personal","Personal"],["gas","Gas"],["debt","Debt"],["savings","Moved to savings"],["income","Extra income"],["refund","Refund"],["skip","Skip"]].map(([k,l]) => `<option value="${k}">${l}</option>`).join("");
  const bar = !items.length ? `<p class="muted">Nothing left to review.</p>` : S.rsel ? `<div class="selbar">
      <div class="row" style="justify-content:space-between;margin-bottom:8px"><b>${n} selected</b><span class="row"><button class="btn ghost sm" data-act="rsel-all">${n === items.length ? "Clear" : "Select all " + items.length}</button><button class="btn ghost sm" data-act="rsel-done">Done</button></span></div>
      <div class="row"><select class="input" data-act="rsel-set" style="width:auto;min-height:38px;padding:6px 10px" ${n ? "" : "disabled"} aria-label="Set where the selected charges go">${setOpts}</select><button class="btn sm" data-act="rsel-confirm" ${n ? "" : "disabled"}>Confirm ${n || ""}</button><button class="btn danger sm" data-act="rsel-deny" ${n ? "" : "disabled"}>Deny ${n || ""}</button></div>
    </div>` : `<div class="bulk"><span class="muted">${items.length} to review. The pre-selected choice is my best guess, and it learns from what you pick.</span><span class="row" style="gap:8px"><button class="btn ghost" data-act="rsel-start">Select</button><button class="btn yellow" data-act="confirm-all">Confirm all ${items.length}</button><button class="btn danger" data-act="deny-all">Deny all ${items.length}</button></span></div>`;
  return head + reviewControls() + bar + body + dupHtml + deniedHtml;
}

function viewImportCard(r){
  if (r.state === "parsing") return `<div class="imp"><b>${esc(r.name)}</b><div class="muted small" style="margin-top:6px"><span class="spinner"></span> ${esc(r.msg||"Reading…")}</div></div>`;
  if (r.state === "error") return `<div class="imp"><b>${esc(r.name)}</b><div class="small" style="margin-top:6px;color:var(--neg)">${esc(r.msg)}</div><div class="acts row" style="margin-top:10px"><button class="btn ghost sm" data-act="imp-remove" data-id="${r.id}">Remove</button></div></div>`;
  const items = r.items.map(i => ({...i, flow: r.flip ? -i.flow : i.flow}));
  const nPay = items.filter(i => i.pay || isCardPayment({...i, src: r.src})).length;
  const dates = items.map(i => i.date).sort();
  const out = items.filter(i => i.flow < 0).reduce((a,i)=>a-i.flow,0), inn = items.filter(i=>i.flow>0).reduce((a,i)=>a+i.flow,0);
  const prev = items.slice(0,6).map(i => `<tr><td class="num">${short(i.date)}</td><td>${esc(i.desc)}</td><td class="num" style="color:${i.flow>0?"var(--pos)":"inherit"}">${i.flow>0?"+"+money(i.flow):money(-i.flow)}</td></tr>`).join("");
  const srcSel = Object.entries(SOURCES).filter(([k]) => !["manual","sheet"].includes(k)).map(([k,l]) => `<option value="${k}" ${r.src===k?"selected":""}>${l}</option>`).join("");
  if (r.state === "added") return `<div class="imp"><b>${esc(r.name)}</b><div class="small muted" style="margin-top:4px">${esc(r.msg)}</div><div class="row" style="margin-top:10px"><button class="btn sm" data-tab="review">Go to Review</button><button class="btn ghost sm" data-act="imp-remove" data-id="${r.id}">Clear</button></div></div>`;
  return `<div class="imp">
    <div class="row" style="justify-content:space-between"><b>${esc(r.name)}</b><select class="input" style="width:auto;min-height:38px;padding:6px 10px" data-act="imp-src" data-id="${r.id}" aria-label="Statement source">${srcSel}</select></div>
    <div class="small muted" style="margin-top:6px">${items.length} transactions${dates.length?`, ${short(dates[0])} to ${short(dates[dates.length-1])}`:""}. <span class="num">${money(out)}</span> out, <span class="num">${money(inn)}</span> in. ${esc(r.how||"")}${nPay ? ` ${nPay} card payment${nPay>1?"s":""} will be left out.` : ""}</div>
    <div class="tablewrap"><table>${prev}</table></div>
    ${items.length>6?`<div class="small muted" style="margin-top:6px">and ${items.length-6} more</div>`:""}
    <div class="row" style="margin-top:12px;justify-content:flex-end">
      <button class="btn ghost sm" data-act="imp-flip" data-id="${r.id}">Flip signs</button>
      <button class="btn ghost sm" data-act="imp-remove" data-id="${r.id}">Remove</button>
      <button class="btn sm" data-act="imp-add" data-id="${r.id}" ${items.length?"":"disabled"}>Send to Review</button>
    </div></div>`;
}

/* ---------- trends ---------- */
function viewTrends(){
  const list = periodList();
  if (!list.length) return `<div class="topbar"><h1>Trends</h1></div><div class="list"><div class="empty"><h3>No paychecks yet</h3>Trends appear after your first paycheck.</div></div>`;
  const n = S.range === "all" ? list.length : Math.min(list.length, +S.range);
  const ps = list.slice(-n);
  const cs = ps.map(p => { const c = calc(p); return {p, ...c, personalBudget: r2(c.personalBudget - c.carry)}; });
  const saved = cs.reduce((a,c)=>a+c.savings,0), spent = cs.reduce((a,c)=>a+c.personalSpent+c.gasSpent+c.debtSpent,0), extra = cs.reduce((a,c)=>a+c.extra,0);
  const W = 640, H = 220, padL = 44, padB = 26, bw = (W - padL - 10) / cs.length;
  const max = Math.max(1, ...cs.map(c => Math.max(c.personalSpent, c.personalBudget))) * 1.08;
  const y = v => H - padB - (Math.max(0, v) / max) * (H - padB - 10);
  const ticks = [0, max/2, max].map(v => `<line x1="${padL}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${padL-6}" y="${y(v)+4}" text-anchor="end">${money0(v)}</text>`).join("");
  const bars = cs.map((c,i) => {
    const x = padL + i*bw + bw*0.18, w = bw*0.64, over = c.personalSpent > c.personalBudget;
    return `<rect x="${x}" y="${y(Math.max(0,c.personalSpent))}" width="${w}" height="${Math.max(0, H-padB-y(Math.max(0,c.personalSpent)))}" rx="3" fill="${over?"var(--debt)":"var(--personal)"}"><title>${short(c.p)}: ${money(c.personalSpent)} of ${money(c.personalBudget)}</title></rect><line x1="${x-2}" x2="${x+w+2}" y1="${y(c.personalBudget)}" y2="${y(c.personalBudget)}" stroke="var(--ink)" stroke-width="2.5"/>${(cs.length<=12||i%2===0)?`<text x="${x+w/2}" y="${H-8}" text-anchor="middle">${short(c.p)}</text>`:""}`;
  }).join("");
  const catTot = {}, merch = {};
  ps.forEach(p => (S.periods[p].txns||[]).filter(t => t.fund === "personal").forEach(t => {
    const k = category(t); catTot[k] = (catTot[k]||0) + (+t.amount||0);
    const m = norm(t.desc) || "other"; merch[m] = (merch[m]||0) + (+t.amount||0);
  }));
  const cats = Object.entries(catTot).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const cmax = Math.max(1, ...cats.map(c=>c[1]));
  const tops = Object.entries(merch).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const rng = [["3","3 paychecks"],["6","6"],["12","12"],["all","All"]].map(([k,l]) => `<button data-act="range" data-r="${k}" aria-pressed="${S.range===k}">${l}</button>`).join("");
  return `<div class="topbar"><h1>Trends</h1><span class="row" style="gap:6px"><button class="btn ghost sm" data-act="open-compare">Compare paychecks</button><button class="btn ghost sm" data-act="open-year">Year in review</button></span></div>
  <div class="seg">${rng}</div>
  <div class="stats">
    <div class="stat"><div class="v num" style="color:var(--pos)">${money0(saved)}</div><div class="k">Saved</div></div>
    <div class="stat"><div class="v num">${money0(spent)}</div><div class="k">Spent</div></div>
    <div class="stat"><div class="v num">${money0(extra)}</div><div class="k">Extra income</div></div>
  </div>
  <div class="panel"><h3>Personal spending per paycheck</h3><p class="small muted" style="margin:2px 0 8px">Bars are what you spent. The black line is what you had to spend after any overspending carried in. Red bars went over.</p>
    <div class="tablewrap"><svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Personal spending per paycheck">${ticks}${bars}</svg></div></div>
  <div class="panel"><h3 style="margin-bottom:8px">Where personal money went</h3>${cats.length?cats.map(([k,v]) => `<div class="cat"><span>${esc(k)}</span><span class="b"><i style="width:${v/cmax*100}%"></i></span><span class="num">${money0(v)}</span></div>`).join(""):'<p class="muted">No personal spending in this range.</p>'}</div>
  <div class="panel"><h3 style="margin-bottom:8px">Top places</h3>${tops.map(([k,v]) => `<div class="cat" style="grid-template-columns:1fr auto"><span style="text-transform:capitalize">${esc(k)}</span><span class="num">${money(v)}</span></div>`).join("")||'<p class="muted">Nothing yet.</p>'}</div>`;
}

/* ---------- app updates: pick the zip, publish it to GitHub ---------- */
const GH_KEY = "payday-gh";
function ghCfg(){ try{ return JSON.parse(localStorage.getItem(GH_KEY)) || {}; }catch(_){ return {}; } }
function ghSet(o){ try{ localStorage.setItem(GH_KEY, JSON.stringify({...ghCfg(), ...o})); }catch(_){} }
function ghRead(){
  const r = document.getElementById("gh-repo"), t = document.getElementById("gh-token");
  const o = {};
  if (r && r.value.trim()) o.repo = r.value.trim().replace(/^https?:\/\/github\.com\//, "").replace(/\/$/, "");
  if (t && t.value.trim()) o.token = t.value.trim();
  if (Object.keys(o).length) ghSet(o);
  const c = ghCfg(); if (!c.repo && ghGuessRepo()) c.repo = ghGuessRepo();
  return c;
}
function ghGuessRepo(){
  const h = location.hostname; if (!h.endsWith(".github.io")) return "";
  const owner = h.split(".")[0], seg = location.pathname.split("/")[1];
  return owner + "/" + (seg && !/\.\w+$/.test(seg) ? seg : h);
}
async function gh(path, opt = {}){
  const c = ghCfg();
  const res = await fetch("https://api.github.com/repos/" + c.repo + path, {...opt, headers:{Authorization:"Bearer " + c.token, Accept:"application/vnd.github+json", "Content-Type":"application/json"}});
  if (!res.ok){
    let m = ""; try{ m = (await res.json()).message; }catch(_){}
    throw new Error(res.status === 401 ? "GitHub didn’t accept that token." : res.status === 404 ? "GitHub can’t find that repo, or the token doesn’t have access to it." : "GitHub said: " + (m || res.status));
  }
  return res.json();
}
async function unzip(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf), td = new TextDecoder();
  let e = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50){ e = i; break; }
  if (e < 0) throw new Error("That doesn’t look like a zip file.");
  const n = dv.getUint16(e + 10, true); let p = dv.getUint32(e + 16, true); const out = [];
  for (let k = 0; k < n; k++){
    if (dv.getUint32(p, true) !== 0x02014b50) throw new Error("That zip file looks damaged.");
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true), nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), lo = dv.getUint32(p + 42, true);
    const name = td.decode(u8.subarray(p + 46, p + 46 + nl)); p += 46 + nl + el + cl;
    if (name.endsWith("/")) continue;
    const ds = lo + 30 + dv.getUint16(lo + 26, true) + dv.getUint16(lo + 28, true);
    let data = u8.subarray(ds, ds + csize);
    if (method === 8) data = new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
    else if (method !== 0) throw new Error("That zip uses a compression type I can’t read.");

  }

}
async function gitSha(data){
  const h = new TextEncoder().encode("blob " + data.length + "\0"), all = new Uint8Array(h.length + data.length);
  all.set(h); all.set(data, h.length);
  return [...new Uint8Array(await crypto.subtle.digest("SHA-1", all))].map(b => b.toString(16).padStart(2, "0")).join("");
}
function b64(u8){ let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
async function prepareUpdate(file){
  if (!file || !file.size){ toast("Your phone handed over an empty file (0 bytes). Share the zip to Payday instead: tap it in the Claude app or Files, tap Share, pick Payday. Or rename it in Files and choose it again."); return; }
  const c = ghRead(); if (c.repo) ghSet({repo: c.repo});
  if (!c.repo || !c.token){ toast("Save your GitHub repo and token first."); return; }
  toast("Reading the update…");
  try{
    const files = (await unzip(await file.arrayBuffer())).filter(f => !/(^|\/)(__MACOSX\/|\.DS_Store$)/.test(f.name));
    if (files.length && new Set(files.map(f => f.name.split("/")[0])).size === 1 && files.every(f => f.name.includes("/"))) files.forEach(f => { f.name = f.name.slice(f.name.indexOf("/") + 1); });
    if (!files.some(f => f.name === "index.html")) throw new Error("There’s no index.html at the top of that zip, so I didn’t publish it.");
    const branch = (await gh("")).default_branch;
    const ref = await gh("/git/ref/heads/" + branch);
    const commit = await gh("/git/commits/" + ref.object.sha);
    const tree = await gh("/git/trees/" + commit.tree.sha + "?recursive=1");
    const have = new Map(tree.tree.filter(t => t.type === "blob").map(t => [t.path, t.sha]));
    const changed = [];
    for (const f of files){ const sha = await gitSha(f.data); if (have.get(f.name) !== sha) changed.push({name: f.name, data: f.data, isNew: !have.has(f.name)}); }
    if (!changed.length){ toast("Your site already has all of these files."); return; }
    S.update = {branch, parent: ref.object.sha, baseTree: commit.tree.sha, changed};
    openSheet(`<h2>Publish ${changed.length} changed file${changed.length===1?"":"s"}?</h2>
      <p class="muted" style="margin-bottom:8px">Nothing on your site gets deleted. Your data isn’t touched.</p>
      <div class="small" style="margin-bottom:14px;line-height:1.7">${changed.map(f => `<div>${esc(f.name)}${f.isNew ? ' <span class="muted">(new)</span>' : ""}</div>`).join("")}</div>
      <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="gh-push">Publish</button></div>`);
  }catch(err){ toast(err.message || "Something went wrong reading the update."); }
}
async function pushUpdate(){
  const u = S.update; if (!u) return;
  closeSheet(); toast("Publishing… keep this open.");
  try{
    const entries = [];
    for (const f of u.changed){
      const b = await gh("/git/blobs", {method:"POST", body: JSON.stringify({content: b64(f.data), encoding:"base64"})});
      entries.push({path: f.name, mode:"100644", type:"blob", sha: b.sha});
    }
    const t = await gh("/git/trees", {method:"POST", body: JSON.stringify({base_tree: u.baseTree, tree: entries})});
    const cm = await gh("/git/commits", {method:"POST", body: JSON.stringify({message:"Update Payday from the app", tree: t.sha, parents:[u.parent]})});
    await gh("/git/refs/heads/" + u.branch, {method:"PATCH", body: JSON.stringify({sha: cm.sha})});
    S.update = null;
    openSheet(`<h2>Published</h2><p class="muted">GitHub takes about 2 minutes to put it live. After that, tap Refresh app to load it.</p><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-act="close">Close</button><button class="btn" data-act="gh-refresh">Refresh app</button></div>`);
  }catch(err){ toast(err.message || "Publishing failed. Nothing was changed on your site."); }
}
async function refreshApp(){
  try{
    const rs = await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(r => r.unregister()));
    const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k)));
  }catch(_){}
  location.reload();
}

/* ---------- year in review ---------- */
function yearStats(y){
  const ps = periodList().filter(p => p.startsWith(y));
  let earned = 0, extra = 0, spent = 0, saved = 0, owed = 0, over = 0, biggest = null;
  const cats = {}, places = {}, months = {};
  for (const p of ps){
    const c = calc(p); earned += c.pay; extra += c.extra; owed += c.savings; if (c.personalLeft < 0) over++;
    for (const t of (S.periods[p].txns || [])){
      const a = +t.amount || 0;
      if (t.fund === "savings"){ saved += a; continue; }
      if (t.fund === "income") continue;
      spent += a;
      const k = category(t); cats[k] = (cats[k] || 0) + a;
      const m = norm(t.orig || t.desc) || "other"; places[m] = places[m] || {name: t.desc, amt: 0, n: 0}; places[m].amt += a; places[m].n++;
      const mo = t.date.slice(0, 7); months[mo] = (months[mo] || 0) + a;
      if (!biggest || a > biggest.amount) biggest = t;
    }
  }
  return {ps, earned: r2(earned), extra: r2(extra), spent: r2(spent), saved: r2(saved), owed: r2(owed), over, biggest,
    cats: Object.entries(cats).filter(([,v]) => v > 0).sort((a,b) => b[1]-a[1]), places: Object.values(places).sort((a,b) => b.amt - a.amt).slice(0, 10), months};
}
function viewYear(){

  const Y = yearStats(y), cmax = Math.max(1, ...Y.cats.map(c => c[1]));
  const mos = Object.keys(Y.months).sort(), mmax = Math.max(1, ...Object.values(Y.months));
  const W = 640, H = 180, bw = (W - 20) / Math.max(1, mos.length);
  const gs = goalProgress();
  return `<div class="topbar"><h1 style="display:flex;align-items:center;gap:12px"><button class="iconbtn" data-tab="trends" aria-label="Back to Trends">${ICONS.left}</button>Year in review</h1>
    <span class="row">${years.length > 1 ? `<select class="input" data-act="year-pick" style="width:auto;min-height:38px">${years.map(v => `<option ${v===y?"selected":""}>${v}</option>`).join("")}</select>` : ""}<button class="btn ghost sm" data-act="year-export" data-y="${y}">Export .xlsx</button></span></div>
  <p class="muted" style="margin:0">${Y.ps.length} paycheck${Y.ps.length===1?"":"s"} in ${y}.</p>
  <div class="stats"><div class="stat"><div class="v num">${money0(Y.earned + Y.extra)}</div><div class="k">Earned</div></div><div class="stat"><div class="v num" style="color:var(--pos)">${money0(Y.saved)}</div><div class="k">Moved to savings</div></div><div class="stat"><div class="v num">${money0(Y.spent)}</div><div class="k">Spent</div></div></div>

const CLOSE_FROM = "2026-10-16";
function closeoutInfo(p){

  const amazonUnlabeled = (S.periods[p].txns || []).filter(t => t.fund !== "income" && +t.amount > 0 && AMAZON_RE.test((t.desc || "") + " " + (t.orig || "")) && !t.details && !(t.src === "sheet" && t.desc.replace(AMAZON_RE, "").replace(/[^a-z]/gi, "").length > 2)).length;
  const toMove = L ? Math.max(0, L.left) : 0;

}
function closeoutDue(){

}

const monthName = m => { const [y, mo] = m.split("-").map(Number); return `${MON[mo-1]} ${y}`; };
const RECON_SRCS = ["chase_bank", "chase_amazon", "paypal_mc", "paypal"];
function accountsUsedIn(month){
  const seen = new Set();
  periodList().forEach(p => (S.periods[p].txns || []).forEach(t => { if (t.date.startsWith(month) && RECON_SRCS.includes(t.src)) seen.add(t.src); }));
  return [...seen];
}
function reconDue(months){
  const done = new Set((S.recon.matches || []).filter(m => m.ok).map(m => m.src + "|" + m.month));
  const out = []; for (const month of months) for (const src of accountsUsedIn(month)) if (!done.has(src + "|" + month)) out.push({src, month});
  return out;
}
function lastMonth(){ const d = toD(todayIso()); d.setDate(1); d.setMonth(d.getMonth() - 1); return iso(d).slice(0, 7); }
function reconReminder(){
  // From the 5th (statements are usually out by then), remind about last month's accounts until they're matched or snoozed.
  const m = lastMonth(); if (+todayIso().slice(8) < 5) return null;
  if ((S.settings.reconSnooze || "") === m) return null;
  const due = reconDue([m]); return due.length ? {month: m, due} : null;
}
function reconTotals(src, from, to){
  const rows = [];

  const charges = r2(rows.filter(r => r.bankAmt > 0).reduce((a, r) => a + r.bankAmt, 0)), credits = r2(rows.filter(r => r.bankAmt < 0).reduce((a, r) => a - r.bankAmt, 0));
  const inRange = i => i.src === src && i.date >= from && i.date <= to;
  return {rows: rows.sort((a,b) => a.date.localeCompare(b.date)), charges, credits,
    review: S.inbox.items.filter(i => i.status === "pending" && inRange(i)), dups: S.inbox.items.filter(i => i.status === "dup" && inRange(i)), denied: (S.inbox.denied || []).filter(inRange)};
}
function reconSheet(src, month){
  src = src || "chase_amazon"; month = month || lastMonth();
  const from = month + "-01", d = toD(from); d.setMonth(d.getMonth() + 1); d.setDate(0); const to = iso(d);

      <label class="field"><span>Month</span><input class="input" type="month" id="rc-month" value="${month}"></label>

    </div>

    <label class="field"><span>Statement’s total purchases / charges</span><input class="input num" id="rc-stmt" inputmode="decimal" placeholder="$0.00" value="${prev ? prev.stmt : ""}"><small>Not payments to the card or transfers. Those are left out of Payday on purpose.</small></label>

}
function reconCheck(){

   3. HEALTH CHECK
   ===================================================================== */
function healthIssues(){
  const ign = new Set(S.settings.healthIgnore || []), out = [], today = todayIso(), all = [];
  periodList().forEach(p => (S.periods[p].txns || []).forEach(t => all.push({t, p})));
  for (const {t, p} of all){
    // Old spreadsheet entries keep the paycheck you put them in; only newer charges are checked.
    if (!t.pinP && t.src !== "sheet" && periodFor(t.date) !== p)
      out.push({key: "wrongp|" + t.id, kind: "wrongp", p, t, text: `“${t.desc}” is dated ${short(t.date)} but filed in the ${short(p)} paycheck`, fix: "Move to " + short(periodFor(t.date))});
    if (t.fund === "income" && (GAS_RE.test(t.desc) || STORE_OUT_RE.test(t.desc) || AMAZON_RE.test(t.desc)) && !/refund|return|cash ?back|reward/i.test(t.desc))
      out.push({key: "inc|" + t.id, kind: "inc", p, t, text: `“${t.desc}” (${money(+t.amount)}) looks like a purchase but is filed as Extra income`, fix: "Make it a Personal charge"});
    if (t.date > addDays(today, 1) || t.date < "2020-01-01")
      out.push({key: "date|" + t.id, kind: "date", p, t, text: `“${t.desc}” has an odd date: ${t.date}`, fix: "Edit"});
  }
  // possible double entries: same amount and place within 2 days
  const by = {}; all.forEach(x => { if (x.t.fund === "income" || x.t.fund === "savings") return; const k = r2(+x.t.amount).toFixed(2) + "|" + (norm(x.t.orig || x.t.desc) || ""); (by[k] = by[k] || []).push(x); });
  Object.values(by).forEach(g => { if (g.length < 2) return; g.sort((a,b) => a.t.date.localeCompare(b.t.date)); for (let i = 1; i < g.length; i++){ const a = g[i-1], b = g[i]; if (Math.abs(dayDiff(b.t.date, a.t.date)) <= 2 && (a.t.src !== "sheet" || b.t.src !== "sheet")) out.push({key: "dup|" + [a.t.id, b.t.id].sort().join("|"), kind: "dup", p: b.p, t: b.t, other: a, text: `Possible double entry: “${b.t.desc}” ${money(+b.t.amount)} on ${short(a.t.date)} and ${short(b.t.date)}`, fix: "Delete the second"}); } });
  // very large one-offs without a label
  const amts = all.filter(x => x.t.fund === "personal" && +x.t.amount > 0).map(x => +x.t.amount).sort((a,b) => a-b), med = amts.length ? amts[Math.floor(amts.length / 2)] : 0;
  all.forEach(({t, p}) => { if (t.fund === "personal" && +t.amount >= Math.max(300, med * 10) && !t.details && t.src !== "sheet") out.push({key: "big|" + t.id, kind: "big", p, t, text: `Large one-off: “${t.desc}” ${money(+t.amount)} on ${short(t.date)} has no label`, fix: "Add a label"}); });
  const seenK = new Set();
  return out.filter(x => !ign.has(x.key) && !seenK.has(x.key) && seenK.add(x.key));
}

  <p class="muted" style="margin:0 0 12px">Things that look off in your confirmed charges. Fix them, or tap “It’s fine” and Payday won’t mention that one again.</p>

/* ---------- review sorting and account filter ---------- */
function visibleReview(){
  let items = pending();
  if (S.rsrc) items = items.filter(i => i.src === S.rsrc);
  const sort = S.rsort || "new", amt = i => Math.abs(i.flow);
  return items.sort(sort === "old" ? (a,b) => a.date.localeCompare(b.date) : sort === "big" ? (a,b) => amt(b) - amt(a) : sort === "small" ? (a,b) => amt(a) - amt(b) : (a,b) => b.date.localeCompare(a.date));

function undoImport(id){

}

/* ---------- savings goals ---------- */
// Your savings fill your goals in order: the first goal fills up, then the next one starts.
function goalsList(){ return (S.settings.goals || []).filter(g => g && g.name && +g.target > 0); }
function savingsMovedSince(date){
  let t = 0;
  for (const p of periodList()) for (const x of (S.periods[p].txns || [])) if (x.fund === "savings" && (!date || x.date > date)) t += +x.amount || 0;
  return r2(t);
}
function savingsPool(){
  const b = S.settings.savBal;
  if (b && typeof b.amount === "number") return r2(b.amount + savingsMovedSince(b.date));
  const start = savingsStart(); let t = 0;
  for (const p of periodList()) if (start && p >= start) t += calc(p).savingsMoved;
  return r2(t);
}
function savingsPace(){
  // Average moved per paycheck over your last 4 tracked paychecks; until there's history, what each paycheck owes.
  const start = savingsStart(), per = periodList().filter(p => start && p >= start);
  const done = per.slice(0, -1).slice(-4).map(p => calc(p).savingsMoved).filter(v => v > 0);
  if (done.length) return {amt: r2(done.reduce((a,b) => a + b, 0) / done.length), from: "moved"};
  const last = per[per.length - 1] || periodList().slice(-1)[0];
  return {amt: last ? r2(calc(last).savings) : 0, from: "planned"};
}
function goalProgress(){
  let pool = savingsPool(), need = 0;
  const pace = savingsPace();
  return goalsList().map(g => {
    const target = +g.target, saved = Math.max(0, Math.min(target, pool)); pool = r2(pool - saved);
    need = r2(need + target - saved);
    let eta = null;
    if (saved < target && pace.amt > 0){ const paychecks = Math.ceil(need / pace.amt); const d = toD(todayIso()); d.setDate(d.getDate() + paychecks * 14); eta = d; }
    return {...g, target, saved: r2(saved), eta, pace};
  });
}
function goalsCard(){
  const gs = goalProgress();
  if (!gs.length) return `<div class="goals"><div class="row" style="justify-content:space-between"><div><b>Savings goals</b><div class="small muted">Set a target and see when you’ll reach it.</div></div><button class="btn ghost sm" data-act="goals-edit">Add a goal</button></div></div>`;

  </div>`;
}

/* ---------- actions ---------- */
function findTx(id){ for (const p of periodList()){ const t = (S.periods[p].txns||[]).find(x => x.id === id); if (t) return {p, t}; } return null; }
function savePeriod(p){ return store.save("p-" + p, S.periods[p]); }
function saveInbox(){ if (S.inbox.seen.length > 4000) S.inbox.seen = S.inbox.seen.slice(-4000); return store.save("inbox", S.inbox); }
function isSavingsMove(it){
  const texts = [it.desc, it.orig].filter(Boolean), me = String(S.settings.selfName || "").trim().toLowerCase();
  if (me && texts.some(t => /(payment|transfer|money sent|sent|send) to /i.test(t) && t.toLowerCase().includes(me))) return true;
  if (texts.some(t => (S.rules.save || {})[savingsKey(t)])) return true;
  return texts.some(t => /(to|into) .*savings|savings (deposit|transfer)|transfer to savings/i.test(t));
}
const savingsKey = d => normFull(String(d || "").replace(/\(via paypal\)/i, ""));
const GENERIC_XFER = /paypal inst xfer|paypal transfer|^paypal\b|ppd id|web id/i;
const normFull = d => String(d || "").toLowerCase().replace(/[^a-z0-9@. ]/g, " ").replace(/\s+/g, " ").trim();
function learn(it){
  const full = normFull(it.orig || it.desc);
  S.rules.save = S.rules.save || {};
  // Remember the readable name (e.g. "Payment to …"), not Chase's generic PayPal text that every PayPal purchase shares.
  const sk = [it.desc, it.orig].filter(t => t && !GENERIC_XFER.test(t)).map(savingsKey)[0];
  if (it.fund === "savings"){ if (sk && !S.rules.save[sk]){ S.rules.save[sk] = true; S.rules._dirty = true; } return; }
  if (sk && S.rules.save[sk]){ delete S.rules.save[sk]; S.rules._dirty = true; }
  const k = norm(it.orig || it.desc); if (!k || it.fund === "paycheck") return; if (S.rules.map[k] !== it.fund){ S.rules.map[k] = it.fund; S.rules._dirty = true; } }
function saveRules(){ if (S.rules._dirty){ delete S.rules._dirty; store.save("rules", S.rules); } }
function txFromItem(it){ const t = {id: uid(), date: it.date, desc: it.desc, fund: it.fund, amount: it.fund === "income" ? r2(it.flow) : r2(-it.flow), src: it.src}; if (it.details) t.details = it.details; if (it.amz) t.amz = it.amz; if (it.cat) t.cat = it.cat; if (it.tags && it.tags.length) t.tags = it.tags.slice(); if (it.bank !== undefined && Math.abs(Math.abs(it.bank) - Math.abs(it.flow)) > 0.004) t.bank = r2(Math.abs(it.bank)); return t; }

const busyIds = new Set();
async function confirmItems(ids){
  const items = S.inbox.items.filter(i => ids.includes(i.id) && i.status === "pending" && !busyIds.has(i.id));
  if (!items.length) return;
  const closedTargets = [...new Set(items.filter(i => i.fund !== "skip" && i.fund !== "paycheck").map(i => periodFor(i.date)).filter(p => isClosed(p)))];
  if (closedTargets.length && !S.closedOk){ closedGuard(closedTargets[0], {type: "confirm", ids: items.map(i => i.id)}); return; }
  items.forEach(i => busyIds.add(i.id));
  const snap = snapUndo();
  try{ await confirmItemsRun(items, snap); } finally { items.forEach(i => busyIds.delete(i.id)); }
}
async function confirmItemsRun(items, snap){
  const touched = new Set(); let made = 0, skipped = 0, pays = 0; const added = [], createdPays = [];
  // check everything can land BEFORE changing anything, so a failure can't leave half the batch added
  const newPayDates = items.filter(i => i.fund === "paycheck").map(i => i.date);
  const hasHome = periodList().length > 0 || newPayDates.length > 0;

function addImport(r){

  const impId = uid();

  const confirmed = [];
  periodList().forEach(p => (S.periods[p].txns||[]).forEach(t => confirmed.push({...t, p})));
  const used = new Set();
  const within = (a, b, n) => Math.abs((toD(a) - toD(b)) / 864e5) <= n;
  r.log = r.log || [];

  for (const raw of items){
    const base = `${r.src}|${raw.date}|${raw.flow.toFixed(2)}|${norm(raw.desc)}`;
    { const rg = r.range || curRange(); if (rg && !(raw.date >= rg[0] && raw.date <= rg[1]) && !(raw.pay || (raw.flow > 0 && PAYCHECK_RE.test(raw.desc)) && raw.date >= rg[0])){ outside++; L(raw, "outside", `Dated outside ${short(rg[0])} to ${short(rg[1])}.`); continue; } }
    counts[base] = (counts[base] || 0) + 1;
    const fp = hash(base + "#" + counts[base]);
    if (seen.has(fp)){ skipped++; L(raw, "seen", "Came in on an earlier import or pull. It was confirmed, denied, or is already waiting in Review."); continue; }
    seen.add(fp); S.inbox.seen.push(fp);
    const it = {id: uid(), imp: impId, fp, src: r.src, date: raw.date, desc: raw.desc, orig: raw.desc, flow: r2(raw.flow), bank: r2(raw.flow), status:"pending"};
    fixDirection(it, raw.desc); applyShare(it, raw.desc);
    it.fund = suggest(it);
    const nm = (S.rules.names || {})[norm(raw.desc)]; if (nm) it.desc = nm;
    if (raw.pay || isCardPayment(it)){ payCount++; L(raw, "paid", isOwnReload(it) ? "Moving your own money into PayPal isn’t spending. It’s counted when you use it." : "Paying off a card isn’t new spending."); continue; }
    // already confirmed (spreadsheet, manual, or earlier import)?
    const amt = it.flow < 0 ? -it.flow : it.flow;

    if (hitI){
      used.add(hitI.id);
      const pp = hitI.src === "paypal" ? hitI : it, other = pp === it ? hitI : it;
      if (/paypal|pp\*/i.test(other.desc) && !/paypal/i.test(pp.desc)){ other.desc = `${pp.desc} (via PayPal)`; if (other.flow < 0 && isSavingsMove(other)) other.fund = "savings"; }
      logMerge(pp, {desc: other.desc, date: other.date, amount: Math.abs(other.flow), src: other.src, where: "in Review"});
      pp.status = "dup"; pp.dupNote = `Same charge as “${other.desc}” on ${SOURCES[other.src]||other.src}, ${short(other.date)}.`; dupCount++;
      if (pp === it){ L(raw, "dup", it.dupNote); S.inbox.items.push(it); continue; }
    }
    S.inbox.items.push(it); added++; L(raw, "review", it.fund === "skip" ? "Pre-set to Skip, so check it in Review." : "");
  }
  S.inbox.importLog = [{id: impId, at: Date.now(), name: r.name || "Import", src: r.src, added, dups: dupCount, skipped, paid: payCount, outside, total: items.length}, ...(S.inbox.importLog || [])].slice(0, 60);
  r.state = "added";
  r.msg = [`${added} sent to Review`, dupCount && `${dupCount} hidden as duplicates`, payCount && `${payCount} card payment${payCount>1?"s":""} left out`, skipped && `${skipped} already imported`, outside && `${outside} outside this paycheck left out`].filter(Boolean).join(", ") + ".";

const CARD_SRC = ["paypal_mc", "chase_amazon"];
const CARD_PAY_RE = /payment|thank you|autopay|auto pay|epay/i;
function isCardPayment(it){
  // Paying off a card isn't spending: on the card it shows as a credit, at Chase checking as a debit to the card company.
  if (it.flow > 0 && CARD_SRC.includes(it.src) && CARD_PAY_RE.test(it.desc) && !/refund|return/i.test(it.desc)) return true;
  if (it.flow < 0 && it.src === "chase_bank" && TRANSFER_RE.test(it.desc)) return true;
  if (isOwnReload(it)) return true;
  // Paying a card bill from PayPal or anywhere else: the card's own charges are already counted one by one.
  if (it.flow < 0 && CARD_BILL_RE.test(it.orig || it.desc) && !/money transfer from|cash ?back reward|refund/i.test(it.orig || it.desc)) return true;
  return false;
}
// Reloading your own PayPal from Chase (shows at Chase as "Visa Direct" with your name). The spending is counted when you use the money in PayPal.
function isOwnReload(it){
  const t = [it.desc, it.orig].filter(Boolean).join(" ");
  const last = String(S.settings.selfName || "").trim().split(/\s+/).slice(-1)[0];
  if (it.flow < 0 && /visa direct/i.test(t) && last && t.toLowerCase().includes(last.toLowerCase())) return true;
  if (it.flow < 0 && /paypal.*(add (to )?balance|add funds|add money)/i.test(t)) return true;
  // The PayPal side of a reload: "Money Transfer from VISA Debit Card ••••6976", "Add money from bank". Not cashback.
  if (it.flow > 0 && /add(ed)? (funds|money)|money added|instant transfer from|transfer from .*(debit|visa|bank|checking|chase|savings acc)/i.test(t) && !/cash ?back|reward/i.test(t)) return true;
  return false;
}
const CARD_BILL_RE = /paypal cashback mastercard|paypal cash back mastercard|paypal mastercard|paypal credit card|synchrony|syncb|chase card services|chase credit crd|payment to chase card|amazon (prime )?(store )?card|credit card (bill|payment)|card payment|epay/i;
function suggest(it){
  if (it.flow < 0 && isSavingsMove(it)) return "savings";
  const k = norm(it.orig || it.desc);
  if (k && S.rules.map[k]){ const f = S.rules.map[k]; if ((it.flow > 0) === ["income","paycheck"].includes(f) || f === "skip" || (f === "personal")) return f; }
  if (it.flow > 0 && PAYCHECK_RE.test(it.desc)) return "paycheck";
  if (TRANSFER_RE.test(it.desc)) return "skip";
  if (it.flow < 0 && GAS_RE.test(it.desc)) return "gas";
  if (it.flow > 0) return (it.src === "chase_bank" || it.src === "paypal") && !/refund|return|reversal|credit/i.test(it.desc) ? "income" : "personal";
  return "personal";
}

function mergeDocs(cloud, local){
  const out = {...local, ...cloud};

    const c = cloud[id], l = local[id]; if (!c) continue;
    if (Array.isArray(c.txns) || Array.isArray(l.txns)){
      const ids = new Set((c.txns || []).map(t => t.id));
      out[id] = {...c, txns: [...(c.txns || []), ...(l.txns || []).filter(t => !ids.has(t.id))]};
    } else if (id === "inbox"){
      const ids = new Set((c.items || []).map(t => t.id)), fps = new Set((c.items || []).map(t => t.fp));
      out[id] = {...c, items: [...(c.items || []), ...(l.items || []).filter(t => !ids.has(t.id) && !fps.has(t.fp))], seen: [...new Set([...(c.seen || []), ...(l.seen || [])])].slice(-4000)};

async function attachCloud(u){

  try{
    if (lsGet("payday-linked") !== u.uid){
      // First time this device joins: combine what's here with what's in the cloud, losing nothing.
      const snap = await ref.get({source:"server"});
      const cloud = {}; snap.docs.forEach(d => { cloud[d.id] = d.data(); });
      const merged = mergeDocs(cloud, readLocal());
      const batch = FB.db.batch(); let n = 0;
      for (const [id, body] of Object.entries(merged)) if (JSON.stringify(body) !== JSON.stringify(cloud[id])){ batch.set(ref.doc(id), cleanDoc(body)); n++; }
      if (n) await batch.commit();

    }

    FB.linking = false;
    toast("Connect to the internet to finish turning on sync.");
    window.addEventListener("online", () => { if (FB.user) attachCloud(FB.user); }, {once:true});
    return;
  }
  store.cloud = {ref, uid: u.uid}; S.mode = "cloud"; FB.linking = false;
  FB.unsub = ref.onSnapshot(snap => {
    // Our own not-yet-synced writes echo back mid-save with a half-updated picture (e.g. new transaction
    // but old review list), which brought confirmed items back. This device's state is already current, so skip them.
    if (S.ready && snap.metadata.hasPendingWrites) return;
    const docs = {}; snap.docs.forEach(d => { docs[d.id] = d.data(); });
    writeLocal(docs); applyDocs(docs); S.ready = true;

async function getDriveToken(){

async function driveFetch(url, opts = {}){
  const r = await fetch(url, {...opts, headers: {...(opts.headers || {}), Authorization: "Bearer " + driveTok.token}});
  if (!r.ok){ let msg = r.status + ""; try{ const j = await r.json(); msg = (j.error && j.error.message) || msg; }catch(e){} const err = new Error(msg); err.status = r.status; throw err; }
  return r.status === 204 ? null : r.json();
}
async function driveBackup(){
  if (!FB.user || driveBusy) return;
  driveBusy = true;
  try{
    await getDriveToken();
    const API = "https://www.googleapis.com/drive/v3/files";
    const q = encodeURIComponent("name='Payday backups' and mimeType='application/vnd.google-apps.folder' and trashed=false");
    let folder = ((await driveFetch(`${API}?q=${q}&fields=files(id)`)).files || [])[0];
    if (!folder) folder = await driveFetch(`${API}?fields=id`, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({name:"Payday backups", mimeType:"application/vnd.google-apps.folder"})});
    const name = `payday-backup-${todayIso()}.json`;
    const q2 = encodeURIComponent(`'${folder.id}' in parents and trashed=false`);
    const files = (await driveFetch(`${API}?q=${q2}&fields=files(id,name)&pageSize=500`)).files || [];
    const form = new FormData();
    form.append("metadata", new Blob([JSON.stringify({name, parents:[folder.id], mimeType:"application/json"})], {type:"application/json"}));
    form.append("file", new Blob([JSON.stringify({app:"payday", version:1, exported:new Date().toISOString(), docs: readLocal()})], {type:"application/json"}));
    await driveFetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", {method:"POST", body: form});
    for (const f of files.filter(f => f.name === name)) await driveFetch(`${API}/${f.id}`, {method:"DELETE"}).catch(() => {});
    const old = files.filter(f => f.name !== name && /^payday-backup-/.test(f.name)).sort((a,b) => a.name.localeCompare(b.name));
    for (const f of old.slice(0, Math.max(0, old.length - 59))) await driveFetch(`${API}/${f.id}`, {method:"DELETE"}).catch(() => {});
    lsSet("payday-drive-last", todayIso()); lsSet("payday-last-backup", todayIso());
    toast("Backed up to Google Drive.");
  }catch(e){
    const c = e && e.code;
    if (c === "auth/popup-closed-by-user" || c === "auth/cancelled-popup-request") toast("Google Drive backup skipped. It’ll try again tomorrow.");
    else if (c === "auth/popup-blocked") toast("Allow pop-ups for this site so Drive backups can run.");
    else if (e && e.status === 403 && /drive api|not been used|disabled/i.test(e.message)) toast("Turn on the Google Drive API for your Firebase project (guide step 6).");
    else toast("Google Drive backup didn’t work (" + (c || e.message) + ").");
  }
  driveBusy = false; render();
}

    if (t === "split"){ const n = parseFloat(v); if (!(n > 0 && n <= 100)){ toast("Use a percent from 1 to 100."); return; } v = Math.round(n * 100) / 10000; }
    if (t === "names" && !v.trim()){ toast("A rename can’t be empty. Use ✕ to delete it."); return; }
    ruleSet(t, k, typeof v === "string" ? v.trim() : v); toast("Rule updated."); return;
  }
  if (e.target.dataset && e.target.dataset.rsel !== undefined && S.rsel){ const id = e.target.dataset.rsel; e.target.checked ? S.rsel.add(id) : S.rsel.delete(id); render(); return; }
  if (e.target.dataset && e.target.dataset.act === "rsel-set" && S.rsel){
    const want = e.target.value; if (!want) return;
    let changed = 0, skipped = 0;
    for (const it of S.inbox.items) if (S.rsel.has(it.id)){
      const out = it.flow < 0, f = want === "refund" ? "personal" : want;
      const ok = want === "skip" || (out ? ["personal","gas","debt","savings"].includes(want) : ["income","refund"].includes(want));
      if (ok){ it.fund = f; changed++; } else skipped++;
    }
    render(); saveInbox();
    toast(`${changed} set to ${e.target.selectedOptions[0].text}.` + (skipped ? ` ${skipped} skipped because ${skipped === 1 ? "it’s" : "they’re"} ${want === "income" || want === "refund" ? "a charge, not money in" : "money in, not a charge"}.` : ""));
    return;
  }
  if (e.target.id === "amzIn" && e.target.files.length){ amzImport(e.target.files[0]); e.target.value = ""; return; }
  if (e.target.dataset && e.target.dataset.label){ saveLabel(e.target.dataset.label, e.target.value); return; }
  if (e.target.id === "plaid-url"){ S.settings = {...S.settings, plaidUrl: e.target.value.trim(), kind:"settings"}; store.save("settings", S.settings); PL.items = null; PL.err = ""; render(); plaidAutoLoad(); return; }
  if (e.target.dataset && e.target.dataset.act === "plaid-period"){ PL.pick = e.target.value; render(); return; }
  if (e.target.dataset && e.target.dataset.act === "plaid-map"){ S.settings = {...S.settings, plaidMap: {...(S.settings.plaidMap || {}), [e.target.dataset.id]: e.target.value}, kind:"settings"}; store.save("settings", S.settings); toast("Got it."); return; }
  if (e.target.id === "gh-repo"){ ghSet({repo: e.target.value.trim().replace(/^https?:\/\/github\.com\//, "").replace(/\/$/, "")}); return; }
  if (e.target.id === "gh-token"){ ghSet({token: e.target.value.trim()}); return; }
  if (e.target.id === "updateIn" && e.target.files.length){ prepareUpdate(e.target.files[0]); e.target.value = ""; return; }
  if (e.target.id === "restoreIn" && e.target.files.length){ readBackup(e.target.files[0]); e.target.value = ""; return; }
  if (e.target.id === "fileIn" && e.target.files.length){ handleFiles([...e.target.files]); e.target.value = ""; }
  const s = e.target.closest("[data-act=imp-src]"); if (s){ const r = S.imports.find(x => x.id === s.dataset.id); if (r){ r.src = s.value; if (r.sig){ S.settings.formats = {...(S.settings.formats || {}), [r.sig]: s.value}; store.save("settings", S.settings); toast(`Got it. Files like this will be marked ${SOURCES[s.value]} from now on.`); } } }
});
document.addEventListener("dragover", e => { const d = e.target.closest && e.target.closest("#drop"); if (d){ e.preventDefault(); d.classList.add("over"); } });
document.addEventListener("dragleave", e => { const d = e.target.closest && e.target.closest("#drop"); if (d) d.classList.remove("over"); });
document.addEventListener("drop", e => { const d = e.target.closest && e.target.closest("#drop"); if (d){ e.preventDefault(); d.classList.remove("over"); if (e.dataTransfer.files.length) handleFiles([...e.dataTransfer.files]); } });
function reviewCards(){ return [...document.querySelectorAll("#main article.rv[data-rid]")]; }
function applyRFocus(scroll){
  const cards = reviewCards(); if (!cards.length){ S.rfoc = 0; return; }
  S.rfoc = Math.max(0, Math.min(S.rfoc || 0, cards.length - 1));
  cards.forEach((c, i) => c.classList.toggle("kfocus", i === S.rfoc && !!S.kbd));
  if (scroll && S.kbd) cards[S.rfoc].scrollIntoView({block: "nearest", behavior: "smooth"});
}
function reviewKey(e){
  if (S.view !== "review" || $("#sheetRoot").innerHTML || e.ctrlKey || e.metaKey || e.altKey) return false;
  const tag = (document.activeElement && document.activeElement.tagName) || "";
  if (/INPUT|TEXTAREA|SELECT/.test(tag)) return false;
  const k = e.key.toLowerCase(), cards = reviewCards();
  if ((k === "enter" || k === " ") && /^(BUTTON|A|SUMMARY)$/.test(tag)) return false;
  if (k === "u" && UNDO){ doUndo(); return true; }
  if (!cards.length) return false;
  const move = d => { if (!S.kbd){ S.kbd = true; applyRFocus(true); return; } S.rfoc = (S.rfoc || 0) + d; applyRFocus(true); };
  if (k === "arrowdown" || k === "j"){ move(1); return true; }
  if (k === "arrowup" || k === "k"){ move(-1); return true; }
  if (!S.kbd){ S.kbd = true; applyRFocus(true); }
  const card = cards[Math.max(0, Math.min(S.rfoc || 0, cards.length - 1))];
  const id = card.dataset.rid, ids = card.dataset.gids ? card.dataset.gids.split(",") : [id], it = S.inbox.items.find(i => i.id === id); if (!it) return false;
  if (k === "c" || k === "enter"){ confirmItems(ids); return true; }
  if (k === "d" || k === "delete"){ ids.length > 1 ? denyIds(ids) : denyItem(id); return true; }
  if (k === "e"){ if (card.dataset.gk){ S.rexp = S.rexp || new Set(); S.rexp.add(card.dataset.gk); render(); } else itemSheet(it); return true; }
  if (k === " " && S.rsel){ const on = !ids.every(x => S.rsel.has(x)); ids.forEach(x => on ? S.rsel.add(x) : S.rsel.delete(x)); render(); return true; }
  const map = {p:"personal", g:"gas", b:"debt", s:"savings", i:"income", f:"personal", y:"paycheck", x:"skip"}, f = map[k];
  if (f){
    const ok = it.flow < 0 ? ["personal","gas","debt","savings","skip"].includes(f) && k !== "f" : ["income","paycheck","personal","skip"].includes(f) && k !== "p";
    if (!ok){ toast(it.flow < 0 ? "That option is for money coming in." : "That option is for charges. Use F for a refund."); return true; }
    S.inbox.items.forEach(i => { if (ids.includes(i.id)) i.fund = f; }); render(); saveInbox(); return true;
  }
  return false;
}
document.addEventListener("keydown", e => {
  if (reviewKey(e)){ e.preventDefault(); return; }
  if (e.key === "Enter" && e.target.dataset && e.target.dataset.label){ e.target.blur(); return; }
  if ((e.key === "Enter" || e.key === " ") && e.target.dataset && e.target.dataset.act === "fund-list"){ e.preventDefault(); e.target.click(); return; } if (e.key === "Escape") closeSheet(); });
$("#fab").addEventListener("click", () => txSheet(null));

try{ const t = localStorage.getItem("payday-theme"); if (t && t !== "auto") document.documentElement.dataset.theme = t; }catch(_){}
takeLinkFromUrl(); localBoot(); setupPWA(); initFirebase(); takeSharedFile();
